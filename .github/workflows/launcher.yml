name: Isolated launcher
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix runtime/rc3 --workspaces=false --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: node scripts/apply-native-compat.mjs --backup "$RUNNER_TEMP/moa-native-backup"
      - run: npm run test:launcher
      - run: node --test evals/moa-vs-single/outcome-observation.test.mjs
      - run: >-
          npx --no-install vitest run
          tests/native-contract/moa-memory-readonly.spec.ts
          tests/native-contract/worker-attachments.spec.ts
          tests/native-contract/worker-file-input.spec.tsx
          tests/host/attachment-views.spec.ts
          tests/host/project-memory.spec.ts
          tests/host/tool-name-migration.spec.ts
          tests/host/completion-source-references.spec.ts
          tests/native-contract/moa-background.spec.ts
          tests/client/worker-parent.spec.ts
          tests/host/coordinator-guidance.spec.ts
          tests/host/moa-completion.spec.ts
          tests/host/completion-helper-failure.spec.ts
          tests/host/completion-context.spec.ts
          tests/host/orchestration-prompts.spec.ts
          tests/client/orchestration-input.spec.ts
          tests/native-contract/orchestration-input.spec.tsx --maxWorkers=1
